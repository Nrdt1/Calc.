<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>БортЖурнал</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f5f8;
      --card: #ffffff;
      --card-border: #e5e7eb;
      --divider: #f0f1f5;
      --text: #111827;
      --text-sec: #6b7280;
      --text-mut: #9ca3af;
      --pill-bg: #eef0f5;
      --tab-active: #ffffff;
      --tab-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      --accent: #7c3aed;
      --accent-soft: rgba(124, 58, 237, 0.1);
      --accent-text: #6d28d9;
      --green-soft: rgba(16, 185, 129, 0.12);
      --green-text: #059669;
      --green-btn: #10b981;
      --red-soft: rgba(239, 68, 68, 0.11);
      --red-text: #dc2626;
      --amber-soft: rgba(245, 158, 11, 0.12);
      --amber-text: #d97706;
      --chip-bg: #f3f0ff;
      --chip-border: #ddd6fe;
      --input-pill: #f3f4f6;
    }

    [data-theme="dark"] {
      --bg: #0f0f13;
      --card: #18181e;
      --card-border: #262630;
      --divider: #23232d;
      --text: #f4f4f7;
      --text-sec: #9ca3af;
      --text-mut: #6b7280;
      --pill-bg: #18181e;
      --tab-active: #272733;
      --tab-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
      --accent: #8b5cf6;
      --accent-soft: rgba(139, 92, 246, 0.16);
      --accent-text: #c4b5fd;
      --green-soft: rgba(16, 185, 129, 0.14);
      --green-text: #34d399;
      --green-btn: #10b981;
      --red-soft: rgba(239, 68, 68, 0.14);
      --red-text: #f87171;
      --amber-soft: rgba(245, 158, 11, 0.14);
      --amber-text: #fbbf24;
      --chip-bg: rgba(139, 92, 246, 0.16);
      --chip-border: rgba(139, 92, 246, 0.32);
      --input-pill: #21212a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: 44px;
      transition: background 0.25s, color 0.25s;
      -webkit-font-smoothing: antialiased;
    }

    .num {
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }

    /* Чистая шапка */
    .header-wrap {
      position: sticky;
      top: 0;
      z-index: 30;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 14px 12px;
    }

    .header-inner {
      max-width: 480px;
      margin: 0 auto;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      overflow: hidden;
      border: 1.5px solid var(--card-border);
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand h1 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .theme-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: var(--card);
      color: var(--text-sec);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .theme-btn:active { transform: scale(0.94); }
    .theme-btn svg { width: 18px; height: 18px; }

    /* Сегментированные табы в стиле iOS */
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1.15fr;
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 3px;
      gap: 3px;
    }

    .tab {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 6px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sec);
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab.active {
      background: var(--tab-active);
      color: var(--text);
      box-shadow: var(--tab-shadow);
    }

    .tab svg { width: 15px; height: 15px; }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 14px 14px 0;
    }

    /* Карточки */
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 6px 16px;
      margin-bottom: 12px;
    }

    .card-padded {
      padding: 14px 16px;
    }

    .section-title {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-sec);
      padding: 12px 0 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Мета-карточка: Водитель / Дата / Маршрут */
    .meta-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
    }

    .meta-row + .meta-row {
      border-top: 1px solid var(--divider);
    }

    .meta-split {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .meta-col {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 1;
    }

    .meta-col.date-col {
      flex: 0 0 128px;
    }

    .v-div {
      width: 1px;
      height: 28px;
      background: var(--divider);
      flex-shrink: 0;
    }

    .meta-ic {
      color: var(--accent);
      display: flex;
      flex-shrink: 0;
    }

    .meta-field {
      display: flex;
      flex-direction: column;
      min-width: 0;
      width: 100%;
    }

    .meta-lbl {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-sec);
      margin-bottom: 2px;
    }

    .meta-inp {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 13.5px;
      font-weight: 600;
      width: 100%;
      outline: none;
      padding: 0;
    }

    .meta-inp:focus { color: var(--accent-text); }

    /* Чистые строки списка без рамок вокруг каждого поля */
    .list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid var(--divider);
    }

    .list-row:last-of-type { border-bottom: none; }

    .list-row label {
      font-size: 14.5px;
      font-weight: 500;
      color: var(--text);
      flex: 1;
      min-width: 0;
    }

    .list-row input[type="number"] {
      width: 120px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 15.5px;
      font-weight: 700;
      text-align: right;
      outline: none;
      font-variant-numeric: tabular-nums;
      padding: 2px 0;
    }

    .list-row input::placeholder {
      color: var(--text-mut);
      font-weight: 500;
    }

    .list-row input:focus {
      color: var(--accent-text);
    }

    /* Поле номера накладной в Конс */
    .inv-inp {
      width: 82px;
      border: none;
      background: var(--input-pill);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
      padding: 5px 8px;
      border-radius: 8px;
      outline: none;
      text-align: center;
    }

    .inv-inp:focus {
      box-shadow: 0 0 0 1.5px var(--accent);
    }

    .sum-sm {
      width: 96px !important;
      flex-shrink: 0;
    }

    .kons-lbl {
      flex: 0 0 auto !important;
      margin-right: auto;
    }

    /* Кнопка Калк рядом с ГСМ */
    .btn-mini {
      background: var(--accent-soft);
      color: var(--accent-text);
      border: none;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Мульти-блоки (Kaspi QR, ИВ) */
    .multi-sec {
      padding: 12px 0;
      border-bottom: 1px solid var(--divider);
    }

    .multi-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .multi-name {
      font-size: 14.5px;
      font-weight: 500;
      color: var(--text);
    }

    .multi-sub {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--accent-text);
      font-variant-numeric: tabular-nums;
    }

    .multi-add {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .multi-add input {
      flex: 1;
      border: none;
      background: var(--input-pill);
      color: var(--text);
      border-radius: 11px;
      padding: 9px 12px;
      font-size: 14.5px;
      font-weight: 600;
      outline: none;
      font-variant-numeric: tabular-nums;
    }

    .multi-add input:focus {
      box-shadow: 0 0 0 1.5px var(--accent);
    }

    .btn-plus {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-plus:active { transform: scale(0.94); }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .chips:empty { margin-top: 0; }

    .chip {
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      color: var(--accent-text);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chip span {
      color: var(--red-text);
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
    }

    /* Спокойные итоговые пилюли */
    .pill-total {
      margin: 10px 0 8px;
      padding: 12px 14px;
      border-radius: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 700;
    }

    .pill-green { background: var(--green-soft); color: var(--green-text); }
    .pill-red { background: var(--red-soft); color: var(--red-text); }

    .pill-net {
      margin: 10px 0 4px;
      padding: 14px 15px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--green-soft);
      color: var(--green-text);
    }

    .pill-net.negative {
      background: var(--red-soft);
      color: var(--red-text);
    }

    .pill-net .net-lbl { font-size: 14.5px; font-weight: 700; }
    .pill-net .net-val { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }

    .comment-inp {
      width: 100%;
      border: none;
      background: var(--input-pill);
      color: var(--text);
      border-radius: 11px;
      padding: 10px 12px;
      font-size: 13.5px;
      outline: none;
      margin: 8px 0 8px;
    }

    .comment-inp:focus { box-shadow: 0 0 0 1.5px var(--accent); }

    /* Основные кнопки */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .btn {
      padding: 14px 12px;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: transform 0.15s;
    }

    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); }
    .btn-wa { background: var(--green-btn); }

    /* ГСМ */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--divider);
      cursor: pointer;
    }

    .toggle-row span { font-size: 14.5px; font-weight: 500; }
    .toggle-row input { width: 18px; height: 18px; accent-color: var(--accent); }

    .gsm-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 12px 0 8px;
    }

    .stat-box {
      background: var(--input-pill);
      border-radius: 13px;
      padding: 12px;
      text-align: center;
    }

    .stat-lbl { font-size: 11.5px; color: var(--text-sec); margin-bottom: 4px; font-weight: 500; }
    .stat-val { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }

    /* История и Бэкап */
    .backup-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn-outline {
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 10px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }

    .btn-outline svg { width: 15px; height: 15px; color: var(--accent); }

    .sub-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .sub-tab {
      text-align: center;
      padding: 9px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text-sec);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .sub-tab.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .hist-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }

    .hist-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .hist-date { font-size: 14.5px; font-weight: 700; color: var(--text); }
    .hist-net { font-size: 16px; font-weight: 800; color: var(--green-text); font-variant-numeric: tabular-nums; }
    .hist-meta { font-size: 13px; color: var(--text-sec); line-height: 1.55; margin-bottom: 12px; }
    .hist-meta b { color: var(--text); font-weight: 600; }

    .hist-btns { display: flex; gap: 7px; flex-wrap: wrap; }
    .btn-sm {
      padding: 7px 12px;
      border-radius: 9px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .sm-green { background: var(--green-soft); color: var(--green-text); }
    .sm-amber { background: var(--amber-soft); color: var(--amber-text); }
    .sm-red { background: var(--red-soft); color: var(--red-text); }
    .sm-purple { background: var(--accent-soft); color: var(--accent-text); }

    .hidden { display: none !important; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #272733;
      color: #fff;
      border: 1px solid #3a3a4a;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
      z-index: 100;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<div class="header-wrap">
  <div class="header-inner">
    <div class="header-top">
      <div class="brand">
        <div class="avatar">
          <!-- Если закинешь фото своей Газели в репозиторий как gazel.jpg, замени src на "gazel.jpg" -->
          <img src="gazel.jpg" alt="Газель" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
          <svg style="display:none; color:var(--accent);" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="3" width="15" height="13" rx="2"></rect>
            <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
            <circle cx="5.5" cy="18.5" r="2.5"></circle>
            <circle cx="18.5" cy="18.5" r="2.5"></circle>
          </svg>
        </div>
        <h1>БортЖурнал</h1>
      </div>

      <button class="theme-btn" onclick="toggleTheme()" title="Сменить тему">
        <svg id="sunIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg id="moonIcon" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>

    <div class="tabs">
      <div class="tab active" id="tabBtn-form" onclick="switchTab('form')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 15v-4M12 15V9M16 15v-2"/></svg>
        <span>Рейс</span>
      </div>
      <div class="tab" id="tabBtn-gsm" onclick="switchTab('gsm')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18"/><path d="M15 11h2a2 2 0 0 1 2 2v5a2 2 0 0 0 2 2v0a2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 4"/><rect x="6" y="6" width="6" height="5"/></svg>
        <span>ГСМ</span>
      </div>
      <div class="tab" id="tabBtn-history" onclick="switchTab('history')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
        <span>История (<span id="histCount" class="num">0</span>)</span>
      </div>
    </div>
  </div>
</div>

<!-- ВКЛАДКА 1: РЕЙС -->
<div class="container" id="tab-form">
  <!-- Водитель / Дата / Маршрут -->
  <div class="card">
    <div class="meta-row">
      <div class="meta-col">
        <div class="meta-ic">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="meta-field">
          <span class="meta-lbl">Водитель</span>
          <input type="text" id="tripDriver" class="meta-inp" value="Нурлан" placeholder="Имя водителя" oninput="saveDraft()">
        </div>
      </div>
    </div>

    <div class="meta-row">
      <div class="meta-split">
        <div class="meta-col date-col">
          <div class="meta-ic">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </div>
          <div class="meta-field">
            <span class="meta-lbl">Дата</span>
            <input type="date" id="tripDate" class="meta-inp num" onchange="saveDraft()">
          </div>
        </div>

        <div class="v-div"></div>

        <div class="meta-col">
          <div class="meta-ic">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          </div>
          <div class="meta-field">
            <span class="meta-lbl">Маршрут</span>
            <input type="text" id="tripRoute" class="meta-inp" value="Жетісай — Ильич — Мырзакент" placeholder="Маршрут" oninput="saveDraft()">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Св/н (справочно) -->
  <div class="card">
    <div class="list-row">
      <label style="color: var(--accent-text); font-weight: 600;">Св/н <span style="font-size:12px; color:var(--text-sec); font-weight:400;">(сводная)</span></label>
      <input type="number" id="tripSvn" placeholder="0 ₸" inputmode="numeric" oninput="saveDraft()">
    </div>
  </div>

  <!-- 1. Поступления -->
  <div class="card">
    <div class="section-title">
      <span>1. Поступления</span>
    </div>

    <div class="multi-sec">
      <div class="multi-head">
        <span class="multi-name">Kaspi QR</span>
        <span class="multi-sub" id="sub-qr">0 ₸</span>
      </div>
      <div class="multi-add">
        <input type="number" id="inp-qr" placeholder="Сумма чека" inputmode="numeric" onkeypress="if(event.key==='Enter') addItem('qr')">
        <button class="btn-plus" onclick="addItem('qr')">+</button>
      </div>
      <div class="chips" id="chips-qr"></div>
    </div>

    <div class="multi-sec">
      <div class="multi-head">
        <span class="multi-name">ИВ Kaspi</span>
        <span class="multi-sub" id="sub-ivKaspi">0 ₸</span>
      </div>
      <div class="multi-add">
        <input type="number" id="inp-ivKaspi" placeholder="Сумма ИВ Kaspi" inputmode="numeric" onkeypress="if(event.key==='Enter') addItem('ivKaspi')">
        <button class="btn-plus" onclick="addItem('ivKaspi')">+</button>
      </div>
      <div class="chips" id="chips-ivKaspi"></div>
    </div>

    <div class="multi-sec">
      <div class="multi-head">
        <span class="multi-name">ИВ терминал</span>
        <span class="multi-sub" id="sub-ivTerm">0 ₸</span>
      </div>
      <div class="multi-add">
        <input type="number" id="inp-ivTerm" placeholder="Сумма ИВ терминал" inputmode="numeric" onkeypress="if(event.key==='Enter') addItem('ivTerm')">
        <button class="btn-plus" onclick="addItem('ivTerm')">+</button>
      </div>
      <div class="chips" id="chips-ivTerm"></div>
    </div>

    <div class="list-row">
      <label class="kons-lbl">Конс №1</label>
      <input type="text" id="kons1Inv" class="inv-inp" placeholder="№ накл." oninput="saveDraft()">
      <input type="number" class="inc sum-sm" data-name="Конс №1" placeholder="0 ₸" inputmode="numeric" oninput="calc()">
    </div>
    <div class="list-row">
      <label class="kons-lbl">Конс №2</label>
      <input type="text" id="kons2Inv" class="inv-inp" placeholder="№ накл." oninput="saveDraft()">
      <input type="number" class="inc sum-sm" data-name="Конс №2" placeholder="0 ₸" inputmode="numeric" oninput="calc()">
    </div>
    <div class="list-row">
      <label>Шеф Терминал</label>
      <input type="number" class="inc" data-name="Шеф Терминал" placeholder="0 ₸" inputmode="numeric" oninput="calc()">
    </div>

    <div class="pill-total pill-green">
      <span>Итого поступлений</span>
      <span id="incTotalHeader" class="num">0 ₸</span>
    </div>
  </div>

  <!-- 2. Расходы -->
  <div class="card">
    <div class="section-title">
      <span>2. Расходы</span>
    </div>
    <div class="list-row">
      <label>ГСМ</label>
      <button class="btn-mini" onclick="switchTab('gsm')">Калк</button>
      <input type="number" id="expGsmInput" class="exp sum-sm" data-name="ГСМ" placeholder="0 ₸" inputmode="numeric" oninput="calc()">
    </div>
    <div class="list-row"><label>Платная дорога</label><input type="number" class="exp" data-name="Платная дорога" placeholder="0 ₸" inputmode="numeric" oninput="calc()"></div>
    <div class="list-row"><label>Обед</label><input type="number" class="exp" data-name="Обед" placeholder="0 ₸" inputmode="numeric" oninput="calc()"></div>
    <div class="list-row"><label>Тачка</label><input type="number" class="exp" data-name="Тачка" placeholder="0 ₸" inputmode="numeric" oninput="calc()"></div>
    <div class="list-row"><label>Стоянка</label><input type="number" class="exp" data-name="Стоянка" placeholder="0 ₸" inputmode="numeric" oninput="calc()"></div>
    <div class="list-row"><label>Такси</label><input type="number" class="exp" data-name="Такси" placeholder="0 ₸" inputmode="numeric" oninput="calc()"></div>
    <div class="list-row"><label>Прочее</label><input type="number" class="exp" data-name="Прочее" placeholder="0 ₸" inputmode="numeric" oninput="calc()"></div>

    <div class="pill-total pill-red">
      <span>Итого расходов</span>
      <span id="expTotalHeader" class="num">0 ₸</span>
    </div>
  </div>

  <!-- Сумма возврата (справочно) -->
  <div class="card">
    <div class="list-row">
      <label style="color: var(--amber-text); font-weight: 600;">Сумма возврата</label>
      <input type="number" id="returnSum" placeholder="0 ₸" inputmode="numeric" oninput="saveDraft()">
    </div>
  </div>

  <!-- 3. Итог рейса -->
  <div class="card">
    <div class="section-title">
      <span>3. Итог рейса</span>
    </div>
    <div class="list-row">
      <label style="color:var(--text-sec);">Всего поступлений</label>
      <strong id="sumInc" class="num" style="font-size:15px;">0 ₸</strong>
    </div>
    <div class="list-row">
      <label style="color:var(--text-sec);">Всего расходов</label>
      <strong id="sumExp" class="num" style="font-size:15px;">0 ₸</strong>
    </div>

    <div class="pill-net" id="netRow">
      <span class="net-lbl">Чистыми</span>
      <span id="sumNet" class="net-val">0 ₸</span>
    </div>

    <input type="text" id="tripComment" class="comment-inp" placeholder="Комментарий к рейсу..." oninput="saveDraft()">
  </div>

  <div class="actions">
    <button class="btn btn-primary" onclick="saveTrip()">Сохранить рейс</button>
    <button class="btn btn-wa" onclick="copyCurrentWA()">WhatsApp</button>
  </div>
</div>

<!-- ВКЛАДКА 2: КАЛЬКУЛЯТОР ГСМ -->
<div class="container hidden" id="tab-gsm">
  <div class="card">
    <div class="section-title">
      <span>Калькулятор ГСМ</span>
    </div>

    <div class="list-row">
      <label>Расстояние (км)</label>
      <input type="number" id="gsmDist" placeholder="0" inputmode="decimal" oninput="calcGsm()">
    </div>

    <label class="toggle-row">
      <span>Туда и обратно (×2)</span>
      <input type="checkbox" id="gsmRound" onchange="calcGsm()">
    </label>

    <div class="list-row">
      <label>Расход (л / 100 км)</label>
      <input type="number" id="gsmCons" placeholder="15" inputmode="decimal" oninput="calcGsm()">
    </div>

    <div class="list-row">
      <label>Цена топлива (₸ / л)</label>
      <input type="number" id="gsmPrice" placeholder="205" inputmode="decimal" oninput="calcGsm()">
    </div>

    <div class="gsm-stats">
      <div class="stat-box">
        <div class="stat-lbl">Нужно топлива</div>
        <div class="stat-val" id="gsmLiters" style="color:var(--accent-text);">0.0 л</div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">Стоимость ГСМ</div>
        <div class="stat-val" id="gsmCost" style="color:var(--green-text);">0 ₸</div>
      </div>
    </div>

    <div class="actions" style="margin-bottom:10px;">
      <button class="btn btn-wa" onclick="addGsmToTrip()">В расходы</button>
      <button class="btn btn-primary" onclick="saveGsm()">Сохранить</button>
    </div>
  </div>
</div>

<!-- ВКЛАДКА 3: ИСТОРИЯ -->
<div class="container hidden" id="tab-history">
  <div class="backup-bar">
    <button class="btn-outline" onclick="exportData()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Скачать бэкап</span>
    </button>
    <button class="btn-outline" onclick="importData()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span>Загрузить бэкап</span>
    </button>
  </div>

  <div class="sub-tabs">
    <div class="sub-tab active" id="subTab-trips" onclick="switchHistSub('trips')">Рейсы (<span id="tripHistCount" class="num">0</span>)</div>
    <div class="sub-tab" id="subTab-gsm" onclick="switchHistSub('gsm')">ГСМ (<span id="gsmHistCount" class="num">0</span>)</div>
  </div>
  <div id="historyList"></div>
</div>

<input type="file" id="importFile" class="hidden" accept=".json" onchange="handleImport(event)">
<div class="toast" id="toast">Готово</div>

<script>
  let lists = { qr: [], ivKaspi: [], ivTerm: [] };
  let editingId = null;
  let currentHistSub = 'trips';
  const fmt = n => Math.round(Number(n || 0)).toLocaleString('ru-RU') + ' ₸';
  const sumArr = arr => (arr || []).reduce((a, b) => a + b, 0);

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  function applyTheme(mode) {
    document.documentElement.setAttribute('data-theme', mode);
    document.getElementById('sunIcon').classList.toggle('hidden', mode !== 'dark');
    document.getElementById('moonIcon').classList.toggle('hidden', mode === 'dark');
    localStorage.setItem('theme', mode);
  }

  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme');
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  }

  applyTheme(localStorage.getItem('theme') || 'dark');

  function switchTab(tab) {
    ['form', 'gsm', 'history'].forEach(t => {
      document.getElementById('tabBtn-' + t).classList.toggle('active', tab === t);
      document.getElementById('tab-' + t).classList.toggle('hidden', tab !== t);
    });
    if (tab === 'history') renderHistory();
  }

  function switchHistSub(sub) {
    currentHistSub = sub;
    document.getElementById('subTab-trips').classList.toggle('active', sub === 'trips');
    document.getElementById('subTab-gsm').classList.toggle('active', sub === 'gsm');
    renderHistory();
  }

  function addItem(key) {
    const inp = document.getElementById('inp-' + key);
    const val = parseFloat(inp.value);
    if (!val || val <= 0) return;
    lists[key].push(val);
    inp.value = '';
    renderChips(key);
    calc();
  }

  function removeItem(key, idx) {
    lists[key].splice(idx, 1);
    renderChips(key);
    calc();
  }

  function renderChips(key) {
    const box = document.getElementById('chips-' + key);
    box.innerHTML = lists[key].map((v, i) =>
      `<div class="chip">${v.toLocaleString('ru-RU')} ₸ <span onclick="removeItem('${key}', ${i})">×</span></div>`
    ).join('');
    document.getElementById('sub-' + key).textContent = fmt(sumArr(lists[key]));
  }

  function getFormData() {
    const svn = parseFloat(document.getElementById('tripSvn').value) || 0;
    const returnSum = parseFloat(document.getElementById('returnSum').value) || 0;

    const inc = {};
    let incTotal = sumArr(lists.qr) + sumArr(lists.ivKaspi) + sumArr(lists.ivTerm);
    document.querySelectorAll('.inc').forEach(el => {
      const v = parseFloat(el.value) || 0;
      if (v) inc[el.dataset.name] = v;
      incTotal += v;
    });

    const exp = {};
    let expTotal = 0;
    document.querySelectorAll('.exp').forEach(el => {
      const v = parseFloat(el.value) || 0;
      if (v) exp[el.dataset.name] = v;
      expTotal += v;
    });

    return {
      id: editingId || Date.now(),
      driver: document.getElementById('tripDriver').value.trim(),
      date: document.getElementById('tripDate').value,
      route: document.getElementById('tripRoute').value,
      svn,
      kons1Inv: document.getElementById('kons1Inv').value.trim(),
      kons2Inv: document.getElementById('kons2Inv').value.trim(),
      returnSum,
      comment: document.getElementById('tripComment').value.trim(),
      qrList: [...lists.qr],
      ivKaspiList: [...lists.ivKaspi],
      ivTermList: [...lists.ivTerm],
      inc, exp, incTotal, expTotal,
      net: incTotal - expTotal
    };
  }

  function calc() {
    const d = getFormData();
    document.getElementById('incTotalHeader').textContent = fmt(d.incTotal);
    document.getElementById('expTotalHeader').textContent = fmt(d.expTotal);
    document.getElementById('sumInc').textContent = fmt(d.incTotal);
    document.getElementById('sumExp').textContent = fmt(d.expTotal);
    document.getElementById('sumNet').textContent = fmt(d.net);
    document.getElementById('netRow').classList.toggle('negative', d.net < 0);
    saveDraft();
  }

  function saveDraft() {
    localStorage.setItem('trip_draft_v3', JSON.stringify(getFormData()));
  }

  function loadDraft() {
    document.getElementById('tripDate').value = new Date().toISOString().split('T')[0];
    const raw = localStorage.getItem('trip_draft_v3');
    if (raw) {
      try {
        const d = JSON.parse(raw);
        if (d.driver) document.getElementById('tripDriver').value = d.driver;
        if (d.date) document.getElementById('tripDate').value = d.date;
        if (d.route) document.getElementById('tripRoute').value = d.route;
        if (d.svn) document.getElementById('tripSvn').value = d.svn;
        if (d.kons1Inv) document.getElementById('kons1Inv').value = d.kons1Inv;
        if (d.kons2Inv) document.getElementById('kons2Inv').value = d.kons2Inv;
        if (d.returnSum) document.getElementById('returnSum').value = d.returnSum;
        if (d.comment) document.getElementById('tripComment').value = d.comment;

        lists.qr = d.qrList || [];
        lists.ivKaspi = d.ivKaspiList || [];
        lists.ivTerm = d.ivTermList || [];
        ['qr', 'ivKaspi', 'ivTerm'].forEach(renderChips);

        document.querySelectorAll('.inc').forEach(el => { if (d.inc && d.inc[el.dataset.name]) el.value = d.inc[el.dataset.name]; });
        document.querySelectorAll('.exp').forEach(el => { if (d.exp && d.exp[el.dataset.name]) el.value = d.exp[el.dataset.name]; });
        calc();
      } catch (e) {}
    }

    const gsmPrefs = JSON.parse(localStorage.getItem('gsm_prefs') || '{}');
    if (gsmPrefs.cons) document.getElementById('gsmCons').value = gsmPrefs.cons;
    if (gsmPrefs.price) document.getElementById('gsmPrice').value = gsmPrefs.price;
    calcGsm();
  }

  function clearForm() {
    editingId = null;
    lists = { qr: [], ivKaspi: [], ivTerm: [] };
    ['qr', 'ivKaspi', 'ivTerm'].forEach(key => {
      renderChips(key);
      const inp = document.getElementById('inp-' + key);
      if (inp) inp.value = '';
    });
    document.querySelectorAll('.inc, .exp').forEach(el => el.value = '');
    ['tripSvn', 'kons1Inv', 'kons2Inv', 'returnSum', 'tripComment'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    document.getElementById('tripDate').value = new Date().toISOString().split('T')[0];
    localStorage.removeItem('trip_draft_v3');
    calc();
  }

  function getGsmData() {
    const dist = parseFloat(document.getElementById('gsmDist').value) || 0;
    const round = document.getElementById('gsmRound').checked;
    const cons = parseFloat(document.getElementById('gsmCons').value) || 0;
    const price = parseFloat(document.getElementById('gsmPrice').value) || 0;
    const totalDist = round ? dist * 2 : dist;
    const liters = (totalDist * cons) / 100;
    const cost = Math.round(liters * price);
    return { id: Date.now(), date: new Date().toLocaleDateString('ru-RU'), dist, round, totalDist, cons, price, liters, cost };
  }

  function calcGsm() {
    const g = getGsmData();
    document.getElementById('gsmLiters').textContent = g.liters.toFixed(1) + ' л';
    document.getElementById('gsmCost').textContent = fmt(g.cost);
    localStorage.setItem('gsm_prefs', JSON.stringify({ cons: g.cons || '', price: g.price || '' }));
  }

  function addGsmToTrip(customCost) {
    const cost = customCost !== undefined ? customCost : getGsmData().cost;
    if (!cost) { showToast('Сначала посчитай ГСМ'); return; }
    document.getElementById('expGsmInput').value = cost;
    calc();
    switchTab('form');
    showToast(`ГСМ (${fmt(cost)}) добавлен в рейс!`);
  }

  function saveGsm() {
    const g = getGsmData();
    if (!g.cost) { showToast('Введи расстояние, расход и цену'); return; }
    const hist = JSON.parse(localStorage.getItem('gsm_history') || '[]');
    hist.unshift(g);
    localStorage.setItem('gsm_history', JSON.stringify(hist));
    updateHistCount();
    showToast('Расчёт ГСМ сохранён!');
  }

  function formatMultiLine(label, arr) {
    if (!arr || !arr.length) return '';
    const total = sumArr(arr);
    const details = arr.length > 1 ? ` (${arr.map(v => v.toLocaleString('ru-RU')).join(' + ')})` : '';
    return `• ${label}: ${fmt(total)}${details}\n`;
  }

  function formatWA(d) {
    let txt = `🚚 *ОТЧЁТ О РЕЙСЕ*\n👤 Водитель: ${d.driver || 'Не указан'}\n📅 Дата: ${d.date}\n📍 Маршрут: ${d.route}\n`;
    if (d.svn) txt += `💵 Св/н: ${fmt(d.svn)}\n`;
    txt += `\n💰 *ПОСТУПЛЕНИЯ: ${fmt(d.incTotal)}*\n`;
    txt += formatMultiLine('Kaspi QR', d.qrList);
    txt += formatMultiLine('ИВ Kaspi', d.ivKaspiList);
    txt += formatMultiLine('ИВ терминал', d.ivTermList);

    for (const [k, v] of Object.entries(d.inc || {})) {
      let extra = '';
      if (k === 'Конс №1' && d.kons1Inv) extra = ` (накл. №${d.kons1Inv})`;
      if (k === 'Конс №2' && d.kons2Inv) extra = ` (накл. №${d.kons2Inv})`;
      txt += `• ${k}${extra}: ${fmt(v)}\n`;
    }
    if (!d.inc?.['Конс №1'] && d.kons1Inv) txt += `• Конс №1: накл. №${d.kons1Inv}\n`;
    if (!d.inc?.['Конс №2'] && d.kons2Inv) txt += `• Конс №2: накл. №${d.kons2Inv}\n`;

    txt += `\n💸 *РАСХОДЫ: ${fmt(d.expTotal)}*\n`;
    for (const [k, v] of Object.entries(d.exp || {})) txt += `• ${k}: ${fmt(v)}\n`;

    txt += `\n✅ *ЧИСТЫМИ: ${fmt(d.net)}*`;
    if (d.returnSum) txt += `\n↩️ Сумма возврата: ${fmt(d.returnSum)}`;
    if (d.comment) txt += `\n📝 Комментарий: ${d.comment}`;
    return txt;
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => showToast('Скопировано для WhatsApp!')).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Скопировано для WhatsApp!');
  }

  function copyCurrentWA() { copyText(formatWA(getFormData())); }

  function exportData() {
    const payload = {
      trips: JSON.parse(localStorage.getItem('trip_history') || '[]'),
      gsm: JSON.parse(localStorage.getItem('gsm_history') || '[]')
    };
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(payload));
    const a = document.createElement('a');
    a.setAttribute("href", dataStr);
    a.setAttribute("download", `БортЖурнал_Бэкап_${new Date().toLocaleDateString('ru-RU')}.json`);
    a.click();
    showToast('Бэкап скачан!');
  }

  function importData() { document.getElementById('importFile').click(); }

  function handleImport(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const parsed = JSON.parse(e.target.result);
        const importedTrips = Array.isArray(parsed) ? parsed : (parsed.trips || []);
        const importedGsm = Array.isArray(parsed) ? [] : (parsed.gsm || []);

        const curTrips = JSON.parse(localStorage.getItem('trip_history') || '[]');
        const uniqTrips = [...importedTrips, ...curTrips].filter((v, i, a) => a.findIndex(t => t.id === v.id) === i);
        localStorage.setItem('trip_history', JSON.stringify(uniqTrips));

        const curGsm = JSON.parse(localStorage.getItem('gsm_history') || '[]');
        const uniqGsm = [...importedGsm, ...curGsm].filter((v, i, a) => a.findIndex(t => t.id === v.id) === i);
        localStorage.setItem('gsm_history', JSON.stringify(uniqGsm));

        updateHistCount();
        renderHistory();
        showToast('Бэкап загружен!');
      } catch (err) {
        showToast('Ошибка чтения файла');
      }
    };
    reader.readAsText(file);
  }

  function saveTrip() {
    const d = getFormData();
    if (d.incTotal === 0 && d.expTotal === 0 && d.returnSum === 0 && d.svn === 0) {
      showToast('Сначала введи хоть какие-то суммы');
      return;
    }
    let hist = JSON.parse(localStorage.getItem('trip_history') || '[]');
    if (editingId) {
      hist = hist.map(x => x.id === editingId ? d : x);
      showToast('Рейс обновлён!');
    } else {
      hist.unshift(d);
      showToast('Рейс сохранён!');
    }
    localStorage.setItem('trip_history', JSON.stringify(hist));
    clearForm();
    updateHistCount();
  }

  function editTrip(id) {
    const d = JSON.parse(localStorage.getItem('trip_history') || '[]').find(x => x.id === id);
    if (!d) return;

    editingId = d.id;
    document.getElementById('tripDriver').value = d.driver || 'Нурлан';
    document.getElementById('tripDate').value = d.date;
    document.getElementById('tripRoute').value = d.route;
    document.getElementById('tripSvn').value = d.svn || '';
    document.getElementById('kons1Inv').value = d.kons1Inv || '';
    document.getElementById('kons2Inv').value = d.kons2Inv || '';
    document.getElementById('returnSum').value = d.returnSum || '';
    document.getElementById('tripComment').value = d.comment || '';

    lists.qr = d.qrList || [];
    lists.ivKaspi = d.ivKaspiList || [];
    lists.ivTerm = d.ivTermList || [];
    ['qr', 'ivKaspi', 'ivTerm'].forEach(renderChips);

    document.querySelectorAll('.inc, .exp').forEach(el => el.value = '');
    document.querySelectorAll('.inc').forEach(el => { if (d.inc && d.inc[el.dataset.name]) el.value = d.inc[el.dataset.name]; });
    document.querySelectorAll('.exp').forEach(el => { if (d.exp && d.exp[el.dataset.name]) el.value = d.exp[el.dataset.name]; });

    calc();
    switchTab('form');
    showToast('Рейс открыт для правки');
  }

  function updateHistCount() {
    const t = JSON.parse(localStorage.getItem('trip_history') || '[]').length;
    const g = JSON.parse(localStorage.getItem('gsm_history') || '[]').length;
    document.getElementById('histCount').textContent = t + g;
    document.getElementById('tripHistCount').textContent = t;
    document.getElementById('gsmHistCount').textContent = g;
  }

  function deleteTrip(id) {
    if (!confirm('Удалить этот отчёт?')) return;
    let hist = JSON.parse(localStorage.getItem('trip_history') || '[]');
    localStorage.setItem('trip_history', JSON.stringify(hist.filter(x => x.id !== id)));
    updateHistCount();
    renderHistory();
  }

  function deleteGsm(id) {
    if (!confirm('Удалить расчёт ГСМ?')) return;
    let hist = JSON.parse(localStorage.getItem('gsm_history') || '[]');
    localStorage.setItem('gsm_history', JSON.stringify(hist.filter(x => x.id !== id)));
    updateHistCount();
    renderHistory();
  }

  function copyHistWA(id) {
    const item = JSON.parse(localStorage.getItem('trip_history') || '[]').find(x => x.id === id);
    if (item) copyText(formatWA(item));
  }

  function renderHistory() {
    const box = document.getElementById('historyList');
    if (currentHistSub === 'trips') {
      const hist = JSON.parse(localStorage.getItem('trip_history') || '[]');
      if (!hist.length) {
        box.innerHTML = '<div style="text-align:center; color: var(--text-sec); padding:34px; font-size:14px;">История рейсов пока пустая</div>';
        return;
      }
      box.innerHTML = hist.map(d => `
        <div class="hist-card">
          <div class="hist-top">
            <span class="hist-date">${d.date} · ${d.driver || 'Водитель'}</span>
            <span class="hist-net">${fmt(d.net)}</span>
          </div>
          <div class="hist-meta">
            ${d.route}<br>
            Поступления: <b>${fmt(d.incTotal)}</b> · Расходы: <b>${fmt(d.expTotal)}</b>
            ${d.svn ? '<br>Св/н: <b>' + fmt(d.svn) + '</b>' : ''}
            ${d.returnSum ? '<br>Возврат: <b>' + fmt(d.returnSum) + '</b>' : ''}
            ${d.kons1Inv ? '<br>Конс №1 накл.: <b>№' + d.kons1Inv + '</b>' : ''}
            ${d.kons2Inv ? '<br>Конс №2 накл.: <b>№' + d.kons2Inv + '</b>' : ''}
            ${d.comment ? '<br>📝 ' + d.comment : ''}
          </div>
          <div class="hist-btns">
            <button class="btn-sm sm-green" onclick="copyHistWA(${d.id})">WhatsApp</button>
            <button class="btn-sm sm-amber" onclick="editTrip(${d.id})">Изменить</button>
            <button class="btn-sm sm-red" onclick="deleteTrip(${d.id})">Удалить</button>
          </div>
        </div>
      `).join('');
    } else {
      const hist = JSON.parse(localStorage.getItem('gsm_history') || '[]');
      if (!hist.length) {
        box.innerHTML = '<div style="text-align:center; color: var(--text-sec); padding:34px; font-size:14px;">История ГСМ пока пустая</div>';
        return;
      }
      box.innerHTML = hist.map(g => `
        <div class="hist-card">
          <div class="hist-top">
            <span class="hist-date">${g.date} · ${g.totalDist} км ${g.round ? '(×2)' : ''}</span>
            <span class="hist-net">${fmt(g.cost)}</span>
          </div>
          <div class="hist-meta">
            Топливо: <b>${g.liters.toFixed(1)} л</b> (расход ${g.cons} л/100км по ${g.price} ₸)
          </div>
          <div class="hist-btns">
            <button class="btn-sm sm-purple" onclick="addGsmToTrip(${g.cost})">В рейс</button>
            <button class="btn-sm sm-red" onclick="deleteGsm(${g.id})">Удалить</button>
          </div>
        </div>
      `).join('');
    }
  }

  loadDraft();
  updateHistCount();
</script>
</body>
</html>
